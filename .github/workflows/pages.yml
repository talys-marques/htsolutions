# Presentation on GitHub Pages, on every push to main. The site is PHP (blog-system), which
# Pages can't run: it runs here with the repository content and a static copy gets published.
# In Settings > Pages, choose "GitHub Actions" as the source.
name: Apresentação no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BLOG_DATA_DIR: ${{ github.workspace }}/../dados-site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, fileinfo
          coverage: none

      - id: pages
        uses: actions/configure-pages@v5

      # Throwaway data folder: the site's settings without the production address, analytics
      # and indexing, a one-off admin account (random password, discarded), the blog posts from
      # Strapi and the site pages from site/extensions/site-ht/conteudo/
      - name: Montar o site com o conteúdo do repositório
        run: |
          mkdir -p "$BLOG_DATA_DIR"
          php -r '$s = json_decode(file_get_contents("site/data/settings.json"), true); $s["url"] = ""; $s["head_code"] = ""; $s["seo_hide_site"] = true; unset($s["home_page"], $s["blog_page"]); file_put_contents(getenv("BLOG_DATA_DIR") . "/settings.json", json_encode($s));'
          php -r 'require "site/app/bootstrap.php"; Auth::create("apresentacao", "Apresentação", bin2hex(random_bytes(16)), "admin");'
          php site/extensions/strapi-import/cli.php dados/strapi-2026-10-29
          php site/extensions/site-ht/instalar.php

      - name: Copiar o site em HTML
        run: |
          php -S 127.0.0.1:8080 -t site/public site/public/index.php > "$RUNNER_TEMP/php.log" 2>&1 &
          sleep 2
          node apresentacao/estatico.mjs http://127.0.0.1:8080 _site "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
